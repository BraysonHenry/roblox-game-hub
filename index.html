<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Game Hub -- Official</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1000px; margin: 0 auto 20px auto;
      border-bottom: 1px solid #333; padding-bottom: 15px;
      flex-wrap: wrap; gap: 10px;
    }

    button, .btn {
      background-color: #00a2ff; color: #fff; border: none;
      padding: 8px 16px; border-radius: 4px; cursor: pointer;
      font-weight: bold; text-decoration: none; display: inline-block;
    }
    button:hover, .btn:hover { opacity: 0.9; }

    .search-container { max-width: 1000px; margin: 0 auto 20px auto; display: flex; gap: 10px; }
    input[type="text"], input[type="password"] {
      flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #333;
      background: #1e1e1e; color: #fff;
    }

    .categories { max-width: 1000px; margin: 0 auto 20px auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { background: #222; color: #aaa; }
    .filter-btn.active { background: #00a2ff; color: #fff; }

    .game-grid {
      max-width: 1000px; margin: 0 auto; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
    }

    .game-card {
      background: #1e1e1e; border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; position: relative; border: 1px solid #2a2a2a;
    }
    .thumbnail-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .card-body h3 { margin: 5px 0; font-size: 16px; }
    .creator-tag { font-size: 12px; color: #888; margin-bottom: 10px; }

    .category-badge {
      display: inline-block; font-size: 10px; background: #333;
      padding: 2px 6px; border-radius: 3px; color: #aaa; text-transform: uppercase;
    }
    .verified-badge {
      display: inline-block; font-size: 10px; background: #4caf50;
      color: #fff; padding: 2px 6px; border-radius: 3px; font-weight: bold;
    }

    .star-btn {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: rgba(0,0,0,0.6); border: none; color: #ffca28;
      font-size: 18px; border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .status-box {
      grid-column: 1 / -1; background: #1e1e1e; border: 1px solid #333;
      padding: 20px; text-align: center; border-radius: 8px; color: #aaa;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .modal { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #888; }
  </style>
</head>
<body>

  <header>
    <h1>Roblox Game Hub</h1>
    <div id="auth-section"></div>
  </header>

  <div class="search-container">
    <input type="text" id="search-input" placeholder="Search Roblox games or creators...">
    <button onclick="searchGames()">Search</button>
  </div>

  <div class="categories">
    <button class="filter-btn active" onclick="setCategoryFilter('ALL', this)">All</button>
    <button class="filter-btn" onclick="setCategoryFilter('RPG', this)">RPG</button>
    <button class="filter-btn" onclick="setCategoryFilter('Fighting', this)">Fighting</button>
    <button class="filter-btn" onclick="setCategoryFilter('Social', this)">Social</button>
    <button class="filter-btn" onclick="setCategoryFilter('Horror', this)">Horror</button>
  </div>

  <div class="game-grid" id="popular-grid"></div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
      <h2>Account Access</h2>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth('login')">Sign In</button>
        <button onclick="handleAuth('signup')" style="background: #333;">Create Account</button>
      </div>
    </div>
  </div>

  <!-- User Verified Games Modal -->
  <div class="modal-overlay" id="my-games-modal">
    <div class="modal" style="max-width: 500px;">
      <span class="close-btn" onclick="closeModal('my-games-modal')">&times;</span>
      <h2>My Profile Games</h2>
      <div id="my-games-list" style="margin-top: 15px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
        <!-- Games load here -->
      </div>
    </div>
  </div>

  <script>
    // Define special site roles by website account username
    const OWNER_USERNAMES = ["BrayVR"];
    const ADMIN_USERNAMES = ["administrator"];

    const DEFAULT_ICON = "https://tr.rbxcdn.com/53eb9d17fe2910714da296cca30d43f0/150/150/Image/Png";

    let fetchedRobloxGames = [];
    let currentUser = localStorage.getItem("activeUser") || null;
    let activeCategory = "ALL";
    let cachedGameDetails = {};
    
    // Timer Variables
    let searchStartTime = 0;
    let elapsedTimeMs = 0;
    let timerInterval = null;
    let isLoading = false;

    function getStorage(key, fallback) { return JSON.parse(localStorage.getItem(key)) || fallback; }
    function setStorage(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    function getUserRole(username) {
      if (OWNER_USERNAMES.includes(username)) return "Owner";
      if (ADMIN_USERNAMES.includes(username)) return "Administrator";
      return null;
    }

    function startFetchTimer() {
      searchStartTime = performance.now();
      isLoading = true;
      elapsedTimeMs = 0;
      clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        elapsedTimeMs = performance.now() - searchStartTime;
        renderAllGames();
      }, 50);
    }

    function stopFetchTimer() {
      isLoading = false;
      clearInterval(timerInterval);
      elapsedTimeMs = performance.now() - searchStartTime;
    }

    const FALLBACK_GAMES = [
      { placeId: 2753915549, defaultName: "Blox Fruits", creator: "Gamer Robot Inc", category: "RPG" },
      { placeId: 189707, defaultName: "Natural Disaster Survival", creator: "Stickmasterluke", category: "RPG" },
      { placeId: 920587237, defaultName: "Adopt Me!", creator: "DreamCraft", category: "Social" },
      { placeId: 13772394, defaultName: "Work at a Pizza Place", creator: "Dued1", category: "Social" },
      { placeId: 286090001, defaultName: "Arsenal", creator: "ROLVe Community", category: "Fighting" },
      { placeId: 155615604, defaultName: "Prison Life", creator: "Aesthetical", category: "Fighting" },
      { placeId: 6284583030, defaultName: "Pet Simulator X", creator: "BIG Games", category: "RPG" },
      { placeId: 6068496247, defaultName: "Doors", creator: "LSPLASH", category: "Horror" },
      { placeId: 3527629282, defaultName: "Brookhaven RP", creator: "Wolfpaq", category: "Social" },
      { placeId: 142823291, defaultName: "Murder Mystery 2", creator: "Nikilis", category: "Horror" }
    ];

    async function loadPopularGames() {
      startFetchTimer();
      try {
        const res = await fetch('/api/games');
        const data = await res.json();
        
        if (data && data.games && data.games.length > 0) {
          fetchedRobloxGames = data.games.map((g, idx) => ({
            rank: idx + 1,
            placeId: g.rootPlaceId || g.placeId,
            universeId: g.universeId,
            defaultName: g.name,
            creator: g.builder || g.creatorName || "Roblox Creator",
            category: g.genre || "Game"
          }));
        } else {
          throw new Error("Empty game list");
        }
      } catch (e) {
        console.warn("API request failed. Loading fallback catalog:", e);
        fetchedRobloxGames = FALLBACK_GAMES;
      } finally {
        stopFetchTimer();
        renderAllGames();
      }
    }

    async function searchGames() {
      const q = document.getElementById("search-input").value.trim();
      if (!q) return loadPopularGames();

      startFetchTimer();
      try {
        const res = await fetch(`/api/games?keyword=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (data && data.games && data.games.length > 0) {
          fetchedRobloxGames = data.games.map((g, idx) => ({
            rank: idx + 1,
            placeId: g.rootPlaceId || g.placeId,
            universeId: g.universeId,
            defaultName: g.name,
            creator: g.builder || g.creatorName || "Roblox Creator",
            category: g.genre || "Game"
          }));
        } else {
          fetchedRobloxGames = FALLBACK_GAMES.filter(g => 
            g.defaultName.toLowerCase().includes(q.toLowerCase()) || 
            g.creator.toLowerCase().includes(q.toLowerCase())
          );
        }
      } catch (e) {
        console.warn("Search API failed:", e);
        fetchedRobloxGames = FALLBACK_GAMES.filter(g => 
          g.defaultName.toLowerCase().includes(q.toLowerCase())
        );
      } finally {
        stopFetchTimer();
        renderAllGames();
      }
    }

    function updateUI() {
      const authSec = document.getElementById("auth-section");
      if (currentUser) {
        let verifiedUsers = getStorage("verified_roblox_users", {});
        let linkedRbx = verifiedUsers[currentUser];
        let role = getUserRole(currentUser);

        let roleTag = role ? `, <b>${role}</b>` : '';

        authSec.innerHTML = `
          <span>Welcome${roleTag} ${linkedRbx ? `<span class="verified-badge">✓ @${linkedRbx}</span>` : ''}</span>
          ${!linkedRbx ? `<button onclick="openModal('account-link-modal')" style="background:#ff9800; color:#000;">Link Roblox</button>` : ''}
          <button onclick="renderMyVerifiedGames()">My Games</button>
          <button onclick="openModal('friends-modal'); renderFriendsList();">Friends & Chat</button>
          <button onclick="logout()" style="background: #e53935;">Sign Out</button>
        `;
      } else {
        authSec.innerHTML = `<button onclick="openModal('auth-modal')">Sign In / Sign Up</button>`;
      }
      loadPopularGames();
    }

    async function renderMyVerifiedGames() {
      if (!currentUser) return alert("Please sign in first.");

      const listContainer = document.getElementById("my-games-list");
      listContainer.innerHTML = `<div style="color: #aaa; text-align: center; padding: 10px;">Loading profile games...</div>`;
      openModal('my-games-modal');

      let verifiedUsers = getStorage("verified_roblox_users", {});
      let linkedRbxUsername = verifiedUsers[currentUser] || currentUser;
      const verifiedGames = getStorage("verified_games", {});

      try {
        const res = await fetch(`/api/user-games?username=${encodeURIComponent(linkedRbxUsername)}`);
        const data = await res.json();

        let userGames = data.games || [];

        if (userGames.length === 0) {
          userGames = fetchedRobloxGames.filter(g => 
            g.creator.toLowerCase() === linkedRbxUsername.toLowerCase()
          );
        }

        if (userGames.length === 0) {
          listContainer.innerHTML = `<div style="color: #aaa; text-align: center; padding: 10px;">No public or verified games found for @${linkedRbxUsername}.</div>`;
          return;
        }

        listContainer.innerHTML = userGames.map(g => {
          const isVerified = !!verifiedGames[g.placeId] || g.isVerified;
          return `
            <div style="background: #2a2a2a; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="display: block;">${g.name || g.defaultName}</strong>
                <span class="category-badge">${g.genre || g.category || "Game"}</span>
                ${isVerified ? '<span class="verified-badge">✓ VERIFIED</span>' : ''}
              </div>
              <a href="roblox://placeid=${g.placeId || g.rootPlaceId}" class="btn" style="padding: 5px 10px; font-size: 12px;">Play</a>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Error fetching user games:", err);
        listContainer.innerHTML = `<div style="color: #ff5555; text-align: center; padding: 10px;">Failed to load games from Roblox profile.</div>`;
      }
    }

    function handleAuth(type) {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      if (!u || !p) return alert("Fill in both fields.");

      let users = getStorage("site_users", {});
      if (type === "signup") {
        if (users[u]) return alert("Username taken!");
        users[u] = p;
        setStorage("site_users", users);
      } else {
        if (!users[u] || users[u] !== p) return alert("Invalid credentials.");
      }

      currentUser = u;
      localStorage.setItem("activeUser", u);
      closeModal("auth-modal");
      updateUI();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("activeUser");
      updateUI();
    }

    function toggleFavorite(placeId, e) {
      if (e) e.stopPropagation();
      if (!currentUser) return alert("Please sign in to favorite games.");

      let userFavs = getStorage(`favs_${currentUser}`, []);
      if (userFavs.includes(placeId)) {
        userFavs = userFavs.filter(id => id !== placeId);
      } else {
        userFavs.push(placeId);
      }
      setStorage(`favs_${currentUser}`, userFavs);
      renderAllGames();
    }

    function setCategoryFilter(category, btnElement) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderAllGames();
    }

    function createGameCardHtml(game, verifiedGames, userFavs) {
      const isFav = userFavs.includes(game.placeId);
      const isVerified = !!verifiedGames[game.placeId];

      return `
        <div class="game-card" onclick="openGameInfo(${game.placeId})">
          <button class="star-btn" onclick="toggleFavorite(${game.placeId}, event)" title="${isFav ? 'Unstar' : 'Star'}">
            ${isFav ? '★' : '☆'}
          </button>
          <div class="thumbnail-box">
            <img class="thumb" src="https://assetgame.roblox.com/Game/Tools/ThumbnailAsset.ashx?aid=${game.placeId}&fmt=png&wd=420&ht=230" alt="${game.defaultName}">
          </div>
          <div class="card-body">
            <div>
              <span class="category-badge">${game.category || "Game"}</span>
              ${isVerified ? '<span class="verified-badge">✓ VERIFIED</span>' : ''}
              <h3>${game.defaultName}</h3>
              <div class="creator-tag">By ${game.creator}</div>
            </div>
            <a href="roblox://placeid=${game.placeId}" class="btn" onclick="event.stopPropagation();">Play</a>
          </div>
        </div>
      `;
    }

    function renderAllGames() {
      const verifiedGames = getStorage("verified_games", {});
      const userFavs = currentUser ? getStorage(`favs_${currentUser}`, []) : [];

      let filteredPopular = fetchedRobloxGames.filter(g => {
        return activeCategory === "ALL" || (g.category && g.category.toLowerCase().includes(activeCategory.toLowerCase()));
      });

      let popGrid = document.getElementById("popular-grid");
      let secondsFormatted = (elapsedTimeMs / 1000).toFixed(2);

      if (isLoading) {
        popGrid.innerHTML = `
          <div class="status-box">
            ⏱️ Searching Roblox network... (${secondsFormatted}s elapsed)
          </div>
        `;
        return;
      }

      if (filteredPopular.length === 0) {
        popGrid.innerHTML = `
          <div class="status-box" style="color: #ff5555; border-color: #552222;">
            ⚠️ No games found. It took <b>${secondsFormatted}s</b> (${Math.round(elapsedTimeMs)} ms) to search the network.
          </div>
        `;
        return;
      }

      let popHtml = "";
      filteredPopular.forEach(g => {
        popHtml += createGameCardHtml(g, verifiedGames, userFavs);
      });
      popGrid.innerHTML = popHtml;
    }

    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    updateUI();
  </script>
</body>
</html>
